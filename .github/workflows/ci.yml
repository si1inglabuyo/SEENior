name: CI

on:
  push:
    branches: [main, dashboard]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          SEENIOR_ALLOW_DEV_SECRET: "1"
        run: python -m pytest tests/ -q

  dashboard:
    name: Dashboard lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: barangay-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: barangay-dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app/SEENior
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # The runner already has the Android SDK. Accepting its licences lets Gradle download the
      # platform the app compiles against. `|| true` because `yes` exits when the pipe closes.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        # gradle.properties pins org.gradle.java.home to a Windows path for local builds; the
        # command-line property overrides it with the runner's JDK.
        run: |
          chmod +x gradlew
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:testDebugUnitTest --console=plain
